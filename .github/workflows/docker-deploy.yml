name: Build, Push and Deploy Docker Image
 
# Trigger on every push to the main branch
on:
  push:
    branches:
      - main
 
jobs:
 
  # ── JOB 1: Build image and push to Docker Hub ──────────────────────
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
 
    steps:
 
      - name: Checkout Code
        uses: actions/checkout@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-app:v${{ github.run_number }}
 
      - name: Confirm Push
        run: echo "Image pushed to Docker Hub successfully!"
 
  # ── JOB 2: Deploy to Azure Linux VM ────────────────────────────────
  deploy-to-azure:
    name: Deploy to Azure Linux VM
    runs-on: ubuntu-latest
    needs: build-and-push     # Only runs after Job 1 succeeds
 
    steps:
 
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd flask-todo-app
            docker-compose down
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-app:latest
            docker-compose up -d
            echo "Deployment complete!"
